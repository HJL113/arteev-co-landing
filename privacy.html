<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy | Arteev Labs Inc.</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://arteev.co/privacy-en.html">
  <script>
    (function() {
      var lang;
      try { lang = localStorage.getItem("arteev-lang"); } catch(e) {}
      if (!lang) {
        var navLang = (navigator.language || navigator.userLanguage || "").toLowerCase();
        lang = navLang.indexOf("ko") === 0 ? "ko" : "en";
      }
      var target = lang === "ko" ? "privacy-ko.html" : "privacy-en.html";
      location.replace(target);
    })();
  </script>
</head>
<body>
  <noscript>
    <p style="font-family: -apple-system, sans-serif; padding: 24px;">
      Choose language: <a href="privacy-ko.html">한국어</a> · <a href="privacy-en.html">English</a>
    </p>
  </noscript>
</body>
</html>
